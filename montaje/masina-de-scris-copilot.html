<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>De la mașina de scris la Copilot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* Aceeași paletă ca Ceasul de Pauză și panoul de curs. Pagină cu un singur aspect (întunecat): se partajează pe Zoom. */
  :root{
    --bg:#0f1720; --bg-2:#0b1119; --surface:#16202b; --line:#233241;
    --text:#eaf0f5; --dim:#87a0b3; --accent:#8ecb9d; --warm:#e7ad6b;
    --hd:"Manrope",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
    --bd:"IBM Plex Sans",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  html{color-scheme:dark}
  body{background:radial-gradient(1200px 700px at 78% 42%,#15222f 0%,var(--bg) 60%,var(--bg-2) 100%);
       color:var(--text);font:400 18px/1.5 var(--bd);overflow:hidden}
  body.idle{cursor:none}
  [hidden]{display:none!important}
  :focus-visible{outline:2px solid var(--warm);outline-offset:3px}

  .app{position:relative;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;
       padding:clamp(16px,2.4vw,32px) clamp(20px,4vw,64px)}

  /* ---- sus: titlu mic + ceas real ---- */
  .bar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
  .brand{font:800 clamp(12px,1.1vw,15px)/1 var(--hd);letter-spacing:.16em;text-transform:uppercase;color:var(--warm)}
  .brand small{display:block;margin-top:8px;font:500 clamp(12px,1vw,14px)/1.3 var(--bd);letter-spacing:.02em;text-transform:none;color:var(--dim)}
  .clock{text-align:right}
  .clock .t{font:800 clamp(34px,5.2vw,76px)/1 var(--hd);font-variant-numeric:tabular-nums;letter-spacing:.01em}
  .clock .r{margin-top:6px;font:600 clamp(13px,1.3vw,20px)/1.3 var(--hd);color:var(--warm);font-variant-numeric:tabular-nums}
  .clock .r.gata{color:var(--accent)}

  /* ---- scena ---- */
  .stage{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);align-items:center;gap:clamp(16px,4vw,72px);min-height:0}
  .scene{transition:opacity .9s ease, transform .9s ease}
  .scene.out{opacity:0;transform:translateY(8px)}
  .year{font:800 clamp(64px,13vw,210px)/.95 var(--hd);letter-spacing:-.02em;color:var(--text);font-variant-numeric:tabular-nums;
        white-space:nowrap}
  .year.long{font-size:clamp(48px,9.4vw,150px)}
  .title{font:800 clamp(26px,3.6vw,56px)/1.1 var(--hd);margin:clamp(6px,1.4vh,16px) 0 clamp(8px,1.6vh,20px);color:var(--warm);text-wrap:balance}
  .text{font:400 clamp(17px,1.9vw,30px)/1.45 var(--bd);max-width:36ch;color:var(--text);text-wrap:pretty}
  .fact{margin-top:clamp(10px,2vh,24px);font:500 clamp(14px,1.4vw,22px)/1.4 var(--bd);color:var(--dim);max-width:44ch;display:flex;gap:10px}
  .fact b{color:var(--accent);font-weight:600;white-space:nowrap}
  .glyph{justify-self:center;width:min(100%,46vh,460px);aspect-ratio:1;color:var(--warm)}
  .glyph svg{width:100%;height:100%;display:block;overflow:visible}
  .glyph .a{fill:var(--warm);stroke:none}
  .glyph .g{stroke:var(--accent)}
  .glyph .f{fill:var(--accent);stroke:none}
  .glyph .halo{fill:none;stroke:var(--line);stroke-width:2}
  .scene.in .glyph svg{animation:plutește 9s ease-in-out infinite alternate}
  @keyframes plutește{from{transform:translateY(-5px)}to{transform:translateY(6px)}}

  /* ---- jos: axa timpului + comenzi ---- */
  .foot{display:grid;gap:10px;padding-top:8px}
  .eras{display:flex;gap:6px}
  .era{min-width:0}
  .era .nm{font:600 clamp(11px,.95vw,14px)/1.2 var(--hd);letter-spacing:.06em;text-transform:uppercase;color:var(--dim);
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px}
  .era.on .nm{color:var(--text)}
  .ticks{display:flex;gap:3px}
  .tick{flex:1;height:8px;border-radius:4px;background:var(--line);position:relative;overflow:hidden;border:0;padding:0;cursor:pointer}
  .tick.done{background:#3a5a49}
  .tick.now{background:var(--warm)}
  .tick i{position:absolute;inset:0;background:var(--accent);transform-origin:left;transform:scaleX(0)}
  .row2{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:34px}
  .nota{color:var(--dim);font:500 clamp(13px,1.15vw,17px)/1.3 var(--bd)}
  .ctl{display:flex;gap:8px;align-items:center;transition:opacity .4s}
  body.idle .ctl{opacity:0}
  .btn{min-height:34px;padding:0 13px;border-radius:999px;border:1px solid #2c3d4e;background:transparent;color:var(--text);
       font:600 13px var(--bd);cursor:pointer}
  .btn:hover{border-color:var(--dim)}
  .btn[aria-pressed=true]{background:rgba(231,173,107,.16);border-color:transparent;color:var(--warm)}
  .vol{width:84px;accent-color:var(--warm)}

  @media (max-width:820px){
    body{overflow:auto}
    .app{height:auto;min-height:100%}
    .stage{grid-template-columns:1fr}
    .glyph{width:min(60vw,280px)}
  }
  @media (prefers-reduced-motion:reduce){.scene{transition:none}.scene.in .glyph svg{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">De la mașina de scris la Copilot<small id="sus">Lucrați la test și la sarcinile de pe calculator. Pe ecran: povestea programelor de birou.</small></div>
    <div class="clock"><div class="t" id="ora">--:--</div><div class="r" id="rest" hidden></div></div>
  </header>

  <main class="stage" aria-live="off">
    <div class="scene in" id="scena">
      <div class="year" id="an"></div>
      <div class="title" id="titlu"></div>
      <div class="text" id="text"></div>
      <div class="fact" id="fact"></div>
    </div>
    <div class="glyph" id="glyph" aria-hidden="true"></div>
  </main>

  <footer class="foot">
    <div class="eras" id="ere"></div>
    <div class="row2">
      <div class="nota" id="nota">Testul din chat rămâne deschis. Lucrați în ritmul vostru.</div>
      <div class="ctl" id="ctl">
        <button class="btn" id="bPrev" type="button" aria-label="Scena anterioară">←</button>
        <button class="btn" id="bPlay" type="button" aria-pressed="false">Pauză</button>
        <button class="btn" id="bNext" type="button" aria-label="Scena următoare">→</button>
        <button class="btn" id="bSound" type="button" aria-pressed="false">Sunet</button>
        <input class="vol" id="vol" type="range" min="0" max="100" value="45" aria-label="Volum" hidden>
        <button class="btn" id="bFull" type="button">Ecran complet</button>
      </div>
    </div>
  </footer>
</div>

/* ======================= STARE ======================= */
var params = new URLSearchParams(location.search);
var SEC = Math.max(5, parseInt(params.get('sec'),10) || 128);      /* secunde pe scenă (implicit 128 -> 21 scene ≈ 45 min, o singură trecere) */
var END = params.get('end') || '20:45';                            /* ora la care se termină lucrul individual */
if (params.get('nota')) document.getElementById('nota').textContent = params.get('nota');
var idx = 0, pauza = false, elapsed = 0, ultimul = Date.now(), schimba = false;

function el(id){ return document.getElementById(id); }
function z2(n){ return (n<10?'0':'')+n; }

/* ora Bucureștiului; ?acum=2026-09-22T20:10 o simulează (repetiții) */
function acum(){
  var s = params.get('acum');
  if (s){ var m = s.match(/T(\d{2}):(\d{2})/); if (m) return {h:+m[1], m:+m[2], s:0}; }
  try {
    var p = {}; new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Bucharest',hourCycle:'h23',hour:'2-digit',minute:'2-digit',second:'2-digit'})
      .formatToParts(new Date()).forEach(function(x){p[x.type]=x.value;});
    return {h:+p.hour, m:+p.minute, s:+p.second};
  } catch(e){ var d=new Date(); return {h:d.getHours(), m:d.getMinutes(), s:d.getSeconds()}; }
}

/* ---- axa timpului ---- */
function construiesteAxa(){
  var ere = el('ere'); ere.innerHTML='';
  ERE.forEach(function(e,i){
    var n = e[2]-e[1]+1, d = document.createElement('div'); d.className='era'; d.style.flex = n+' 1 0'; d.id='era'+i;
    d.innerHTML = '<div class="nm">'+e[0]+'</div><div class="ticks"></div>';
    var t = d.querySelector('.ticks');
    for (var k=e[1]; k<=e[2]; k++){ var b=document.createElement('button'); b.type='button'; b.className='tick'; b.id='tk'+k; b.title=SCENE[k].an+' — '+SCENE[k].titlu; b.setAttribute('aria-label',SCENE[k].an+' '+SCENE[k].titlu);
      b.innerHTML='<i></i>'; (function(kk){ b.onclick=function(){ mergiLa(kk); }; })(k); t.appendChild(b); }
    ere.appendChild(d);
  });
}
function coloreazaAxa(){
  SCENE.forEach(function(_,k){ var t=el('tk'+k); t.className='tick'+(k<idx?' done':(k===idx?' now':'')); });
  ERE.forEach(function(e,i){ el('era'+i).className='era'+(idx>=e[1]&&idx<=e[2]?' on':''); });
}

/* ---- afișarea unei scene (cu fade) ---- */
/* micșorează anul până încape în coloană (independent de fontul disponibil pe calculator) */
function fitAn(){
  var y = el('an'), box = el('scena'); y.style.fontSize = '';
  var sz = parseFloat(getComputedStyle(y).fontSize), g = 0;
  while (y.scrollWidth > box.clientWidth + 1 && sz > 36 && g++ < 40){ sz *= .94; y.style.fontSize = sz + 'px'; }
}
window.addEventListener('resize', fitAn);
function arata(i, imediat){
  var sc = SCENE[i], box = el('scena');
  function pune(){
    el('an').textContent = sc.an; el('an').className = 'year';
    el('titlu').textContent = sc.titlu; el('text').textContent = sc.text;
    el('fact').innerHTML = '<b>'+sc.fact[0]+':</b><span>'+sc.fact[1]+'</span>';
    el('glyph').innerHTML = IC[sc.ic];
    box.classList.remove('out'); box.classList.add('in');
    coloreazaAxa(); fitAn();
  }
  if (imediat){ pune(); return; }
  box.classList.add('out'); box.classList.remove('in'); schimba = true;
  setTimeout(function(){ pune(); schimba = false; if (sonorOn) clopotel(); }, 650);
}
function mergiLa(i){ idx = (i+SCENE.length)%SCENE.length; elapsed = 0; arata(idx); }

/* ---- ceasul de sus + timpul rămas până la sfârșitul lucrului ---- */
function tickCeas(){
  var a = acum(); el('ora').textContent = z2(a.h)+':'+z2(a.m);
  var p = END.split(':'), tinta = (+p[0])*3600 + (+p[1])*60, rest = tinta - (a.h*3600+a.m*60+a.s), r = el('rest');
  if (rest > 0 && rest <= 5400){ r.hidden=false; r.className='r'; r.textContent='Lucrul se încheie la '+END+' · rămân '+z2(Math.floor(rest/60))+':'+z2(rest%60); }
  else if (rest <= 0 && rest > -300){ r.hidden=false; r.className='r gata'; r.textContent='Timpul de lucru s-a încheiat · pauză'; }
  else r.hidden = true;
}

/* ---- avansul automat ---- */
function tick(){
  var acum_ = Date.now(), dt = (acum_-ultimul)/1000; ultimul = acum_;
  if (!pauza && !schimba){
    elapsed += dt;
    var f = Math.min(1, elapsed/SEC), t = el('tk'+idx); if (t) t.firstChild.style.transform = 'scaleX('+f+')';
    if (elapsed >= SEC){ if (t) t.firstChild.style.transform='scaleX(0)'; mergiLa(idx+1); }
  }
  tickCeas();
}

/* ---- comenzi ---- */
el('bPrev').onclick = function(){ mergiLa(idx-1); };
el('bNext').onclick = function(){ mergiLa(idx+1); };
el('bPlay').onclick = function(){ pauza = !pauza; this.textContent = pauza ? 'Continuă' : 'Pauză'; this.setAttribute('aria-pressed', pauza); };
el('bFull').onclick = function(){ try{ if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); }catch(e){} };
document.addEventListener('keydown', function(e){
  if (e.target && e.target.tagName==='INPUT') return;
  if (e.key==='ArrowRight'||e.key==='PageDown') mergiLa(idx+1);
  else if (e.key==='ArrowLeft'||e.key==='PageUp') mergiLa(idx-1);
  else if (e.key===' '){ e.preventDefault(); el('bPlay').click(); }
  else if (e.key==='f'||e.key==='F') el('bFull').click();
  else if (e.key==='s'||e.key==='S') el('bSound').click();
});
/* cursorul și comenzile dispar după 3 secunde fără mișcare (ecran curat pe Zoom) */
var idleT; function nuIdle(){ document.body.classList.remove('idle'); clearTimeout(idleT); idleT=setTimeout(function(){document.body.classList.add('idle');},3000); }
['mousemove','keydown','touchstart'].forEach(function(ev){ document.addEventListener(ev, nuIdle, {passive:true}); }); nuIdle();

/* ======================= SUNET OPȚIONAL (generat în pagină, fără fișiere) =======================
   Ambient lent: acorduri La minor–Fa–Do–Sol + note rare din pentatonica La minor, cu ecou lung.
   Implicit oprit. Diferit de melodiile cronometrelor. Pe Zoom: Share Screen + „Share sound”. */
var ac=null, master=null, sonorOn=false, plucks=null, chordT=null, chordI=0, pad=[], echoIn=null;
var ACORDURI = [[110.00,164.81,220.00,261.63],[87.31,130.81,174.61,220.00],[130.81,196.00,261.63,329.63],[98.00,146.83,196.00,246.94]];
var PENTA = [440.00,523.25,587.33,659.25,783.99,880.00];
function graf(){
  ac = new (window.AudioContext||window.webkitAudioContext)();
  master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination);
  var lp = ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=900; lp.connect(master);
  echoIn = ac.createGain(); echoIn.gain.value = 1;
  var dl = ac.createDelay(2); dl.delayTime.value = .7; var fb = ac.createGain(); fb.gain.value = .42;
  var flt = ac.createBiquadFilter(); flt.type='lowpass'; flt.frequency.value=1600;
  echoIn.connect(dl); dl.connect(flt); flt.connect(fb); fb.connect(dl); flt.connect(master); echoIn.connect(master);
  for (var v=0; v<4; v++){                             /* 4 voci de „pad”, fiecare cu doi oscilatori ușor dezacordați */
    var g = ac.createGain(); g.gain.value = .045; g.connect(lp);
    var o1 = ac.createOscillator(), o2 = ac.createOscillator(); o1.type='triangle'; o2.type='sine'; o2.detune.value = 7 + v*2;
    o1.frequency.value = o2.frequency.value = ACORDURI[0][v];
    o1.connect(g); o2.connect(g); o1.start(); o2.start(); pad.push([o1,o2]);
  }
}
function clopotel(){   /* notă lungă, moale, din pentatonică */
  if (!ac) return; var f = PENTA[Math.floor(Math.random()*PENTA.length)], t = ac.currentTime;
  var o = ac.createOscillator(), g = ac.createGain(); o.type='sine'; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(.07,t+.03); g.gain.exponentialRampToValueAtTime(.0001,t+3.2);
  o.connect(g); g.connect(echoIn); o.start(t); o.stop(t+3.4);
}
function programeazaNote(){ if(!sonorOn) return; clopotel(); plucks = setTimeout(programeazaNote, 3500 + Math.random()*4500); }
function schimbaAcord(){
  if(!sonorOn) return; chordI = (chordI+1)%ACORDURI.length;
  pad.forEach(function(p,v){ p.forEach(function(o){ o.frequency.setTargetAtTime(ACORDURI[chordI][v], ac.currentTime, 2.5); }); });
  chordT = setTimeout(schimbaAcord, 16000);
}
function volum(){ return (parseInt(el('vol').value,10)/100)*0.9; }
el('bSound').onclick = function(){
  sonorOn = !sonorOn; this.setAttribute('aria-pressed', sonorOn); el('vol').hidden = !sonorOn;
  if (sonorOn){ if(!ac) graf(); ac.resume(); master.gain.cancelScheduledValues(ac.currentTime); master.gain.setTargetAtTime(volum(), ac.currentTime, 1.5);
    programeazaNote(); chordT = setTimeout(schimbaAcord, 16000); }
  else { clearTimeout(plucks); clearTimeout(chordT); master.gain.setTargetAtTime(0, ac.currentTime, .6); setTimeout(function(){ if(!sonorOn) ac.suspend(); }, 2500); }
};
el('vol').oninput = function(){ if (ac && sonorOn) master.gain.setTargetAtTime(volum(), ac.currentTime, .2); };

/* ======================= PORNIRE ======================= */
construiesteAxa(); arata(0, true); tickCeas();
setInterval(tick, 250);
</script>
