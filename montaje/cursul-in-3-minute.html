<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cursul în 3 minute</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  [hidden]{display:none!important}
  /* Montaj Ora 32 — „Cursul în 3 minute”. Același motor ca montajele Orelor 4–28, dar cu timp fix (180 s), o scenă pe zi și o culoare pe etapă.
     Pagină cu un singur aspect (întunecat): se partajează pe Zoom, cu „Share sound” dacă se pornește muzica. */
  :root{
    --bg:#0f1720; --bg-2:#0b1119; --surface:#16202b; --line:#233241;
    --text:#eaf0f5; --dim:#87a0b3; --accent:#8ecb9d; --warm:#8ecb9d;
    --hd:"Manrope",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
    --bd:"IBM Plex Sans",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:radial-gradient(1200px 700px at 78% 42%,#15222f 0%,var(--bg) 60%,var(--bg-2) 100%);
       color:var(--text);font:400 18px/1.5 var(--bd);overflow:hidden}
  body.idle{cursor:none}
  :focus-visible{outline:2px solid var(--warm);outline-offset:3px}

  .app{position:relative;height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;
       padding:clamp(16px,2.4vw,32px) clamp(20px,4vw,64px)}

  .bar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
  .brand{font:800 clamp(12px,1.1vw,15px)/1 var(--hd);letter-spacing:.16em;text-transform:uppercase;color:var(--warm);transition:color .8s}
  .brand small{display:block;margin-top:8px;font:500 clamp(12px,1vw,14px)/1.3 var(--bd);letter-spacing:.02em;text-transform:none;color:var(--dim)}
  .clock{text-align:right}
  .clock .t{font:800 clamp(30px,4.6vw,68px)/1 var(--hd);font-variant-numeric:tabular-nums;letter-spacing:.01em}
  .clock .t span{color:var(--dim);font-weight:600}
  .clock .r{margin-top:6px;font:600 clamp(13px,1.3vw,20px)/1.3 var(--hd);color:var(--warm);font-variant-numeric:tabular-nums}

  .stage{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);align-items:center;gap:clamp(16px,4vw,72px);min-height:0}
  .scene{transition:opacity .8s ease, transform .8s ease}
  .scene.out{opacity:0;transform:translateY(8px)}
  .when{font:600 clamp(13px,1.3vw,20px)/1.2 var(--hd);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);min-height:1.2em}
  .year{font:800 clamp(56px,11vw,180px)/.98 var(--hd);letter-spacing:-.02em;color:var(--text);white-space:nowrap}
  .title{font:800 clamp(26px,3.6vw,56px)/1.1 var(--hd);margin:clamp(6px,1.4vh,16px) 0 clamp(8px,1.6vh,20px);color:var(--warm);text-wrap:balance;transition:color .8s}
  .text{font:400 clamp(17px,1.9vw,30px)/1.45 var(--bd);max-width:38ch;color:var(--text);text-wrap:pretty}
  .fact{margin-top:clamp(10px,2vh,24px);font:500 clamp(14px,1.4vw,22px)/1.4 var(--bd);color:var(--dim);max-width:46ch;display:flex;gap:10px}
  .fact b{color:var(--accent);font-weight:600;white-space:nowrap}
  .glyph{justify-self:center;width:min(100%,46vh,460px);aspect-ratio:1;color:var(--warm);transition:color .8s}
  .glyph svg{width:100%;height:100%;display:block;overflow:visible}
  .glyph .a{fill:var(--warm);stroke:none}
  .glyph .g{stroke:var(--accent)}
  .glyph .f{fill:var(--accent);stroke:none}
  .glyph .halo{fill:none;stroke:var(--line);stroke-width:2}
  .scene.in .glyph svg{animation:plutește 9s ease-in-out infinite alternate}
  @keyframes plutește{from{transform:translateY(-5px)}to{transform:translateY(6px)}}

  .foot{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding-top:8px}
  .eras{display:flex;gap:6px}
  .era{min-width:0}
  .era .nm{font:600 clamp(11px,.95vw,14px)/1.2 var(--hd);letter-spacing:.06em;text-transform:uppercase;color:var(--dim);
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px}
  .era.on .nm{color:var(--text)}
  .ticks{display:flex;gap:3px}
  .tick{flex:1;min-width:0;height:8px;border-radius:4px;background:var(--line);position:relative;overflow:hidden;border:0;padding:0;cursor:pointer}
  .tick.done{background:#3a5a49}
  .tick.now{background:var(--warm)}
  .tick i{position:absolute;inset:0;background:var(--accent);transform-origin:left;transform:scaleX(0)}
  .row2{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:34px;flex-wrap:wrap}
  .nota{color:var(--dim);font:500 clamp(13px,1.15vw,17px)/1.3 var(--bd);min-width:0}
  .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;transition:opacity .4s}
  body.idle .ctl{opacity:0}
  .btn{min-height:34px;padding:0 13px;border-radius:999px;border:1px solid #2c3d4e;background:transparent;color:var(--text);
       font:600 13px var(--bd);cursor:pointer}
  .btn:hover{border-color:var(--dim)}
  .btn[aria-pressed=true]{background:rgba(231,173,107,.16);border-color:transparent;color:#e7ad6b}
  .vol{width:84px;accent-color:#e7ad6b}

  @media (max-width:820px){
    body{overflow:auto}
    .app{height:auto;min-height:100%}
    .stage{grid-template-columns:minmax(0,1fr)}
    .glyph{width:min(60vw,280px)}
    .bar{flex-wrap:wrap}
    .brand{min-width:0}
    .clock{text-align:left}
    .clock .t{font-size:28px}
    .scene,.text,.fact{min-width:0}
  }
  @media (prefers-reduced-motion:reduce){.scene{transition:none}.scene.in .glyph svg{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">Cursul în 3 minute<small id="sus">Competențe digitale · 8 zile, 32 de ore, 5 module</small></div>
    <div class="clock"><div class="t" id="ceas">0:00<span> / 3:00</span></div><div class="r" id="rest"></div></div>
  </header>

  <main class="stage" aria-live="off">
    <div class="scene in" id="scena">
      <div class="when" id="cand"></div>
      <div class="year" id="an"></div>
      <div class="title" id="titlu"></div>
      <div class="text" id="text"></div>
      <div class="fact" id="fact"></div>
    </div>
    <div class="glyph" id="glyph" aria-hidden="true"></div>
  </main>

  <footer class="foot">
    <div class="eras" id="ere"></div>
    <div class="row2">
      <div class="nota" id="nota">Un singur clip, toată săptămâna cursului. Scena avansează singură.</div>
      <div class="ctl" id="ctl">
        <button class="btn" id="bPrev" type="button" aria-label="Scena anterioară">←</button>
        <button class="btn" id="bPlay" type="button" aria-pressed="false">Pauză</button>
        <button class="btn" id="bNext" type="button" aria-label="Scena următoare">→</button>
        <button class="btn" id="bReia" type="button" hidden>De la început</button>
        <button class="btn" id="bSound" type="button" aria-pressed="false">Sunet</button>
        <input class="vol" id="vol" type="range" min="0" max="100" value="45" aria-label="Volum" hidden>
        <button class="btn" id="bFull" type="button">Ecran complet</button>
      </div>
    </div>
  </footer>
</div>

<script>
/* ======================= SCENELE MONTAJULUI (180 s) =======================
   0 deschidere (12 s) · 8 zile (19 s fiecare) · final (16 s). Faptele sunt din orele cursului:
   Berners-Lee/CERN 1990 (Ora 3-4), index de căutare (Ora 5-6), citire laterală și rutina de 60 de secunde (Ora 11-12),
   :-) propus de Scott Fahlman în 1982 (Ora 13-14), istoric de versiuni OneDrive (Ora 17-18), 2FA (Ora 23),
   „nu apăsa înainte să verifici” (Ora 25), ChatGPT 30 noiembrie 2022, 100 de milioane de utilizatori în circa două luni (Ora 31). */
var SCENE = [
 {d:12, cand:"Ziua 1 până la Ziua 8", an:"32 de ore", titlu:"Cursul în 3 minute", ic:"grila", cul:"#8ecb9d",
  text:"Opt zile, cinci module și o singură idee: tehnologia ne ajută când o înțelegem, o verificăm și o folosim în siguranță.",
  fact:["Traseul","de la primul browser la asistenții de azi"]},
 {d:19, cand:"marți, 22 septembrie", an:"Ziua 1", titlu:"De la calculator la internet", ic:"nor", cul:"#8ecb9d",
  text:"Deschiderea cursului, alfabetizarea digitală și istoria sistemelor de operare; apoi browserele și felul în care ajunge o pagină la voi.",
  fact:["Momentul zilei","1990, CERN: Tim Berners-Lee scrie primul browser, care era și editor"]},
 {d:19, cand:"miercuri, 23 septembrie", an:"Ziua 2", titlu:"Să găsești și să ții ordine", ic:"lupa", cul:"#8ecb9d",
  text:"Motoare de căutare, operatori și verificarea surselor; apoi Word, Excel și fișiere salvate într-un loc unde le mai găsim.",
  fact:["Momentul zilei","o căutare consultă un index făcut din timp, nu tot internetul"]},
 {d:19, cand:"joi, 24 septembrie", an:"Ziua 3", titlu:"Comunicare și gândire critică", ic:"baloane", cul:"#8ecb9d",
  text:"E-mail, mesagerie, întâlniri online și netiquette; apoi știrile false și rutina de 60 de secunde, înainte să dăm un zvon mai departe.",
  fact:["Momentul zilei","citirea laterală: deschizi file noi și verifici sursa în altă parte"]},
 {d:19, cand:"vineri, 25 septembrie", an:"Ziua 4", titlu:"Lucrăm împreună, pe ecran", ic:"fata", cul:"#7fb6e8",
  text:"Comunicarea digitală la serviciu, mesaje care se înțeleg și egalitatea de șanse: nediscriminare și acces pentru toți.",
  fact:["Momentul zilei","1982: apare :-) ca gluma să se vadă și pe ecran"]},
 {d:19, cand:"luni, 28 septembrie", an:"Ziua 5", titlu:"Calendar, documente, prezentări", ic:"coedit", cul:"#7fb6e8",
  text:"Calendarul comun, co-editarea în timp real și întâlnirile online cu plan B; apoi PowerPoint și regulile unei prezentări clare.",
  fact:["Momentul zilei","istoricul de versiuni: te întorci la varianta de acum o oră"]},
 {d:19, cand:"marți, 29 septembrie", an:"Ziua 6", titlu:"PDF, partajare și parole", ic:"lacat", cul:"#7fb6e8",
  text:"PDF-ul care arată la fel pe orice dispozitiv și partajarea pe OneDrive; seara, primele reguli de siguranță: parole bune și autentificare în doi pași.",
  fact:["Momentul zilei","a doua verificare (2FA): o parolă furată nu mai ajunge"]},
 {d:19, cand:"miercuri, 30 septembrie", an:"Ziua 7", titlu:"Phishing, date, copii", ic:"carlig", cul:"#e7ad6b",
  text:"Cum recunoști un mesaj înșelător, cât de puține date dăm despre noi și cum ne protejăm copiii pe internet.",
  fact:["Momentul zilei","nu apăsa înainte să verifici, nici pe e-mail, nici pe SMS, nici la telefon"]},
 {d:19, cand:"joi, 1 octombrie", an:"Ziua 8", titlu:"Actualizări, plăți și AI", ic:"agrafa", cul:"#e7ad6b",
  text:"Actualizări la timp, plăți online cu confirmare, ransomware și deepfake; apoi de la Turing la ChatGPT și primul prompt bun.",
  fact:["Momentul zilei","30 noiembrie 2022: ChatGPT ajunge la 100 de milioane de utilizatori în două luni"]},
 {d:16, cand:"1 octombrie · ultima oră", an:"Mai departe", titlu:"Verificăm, colaborăm, creăm, protejăm, rezolvăm", ic:"harta", cul:"#e58f7a",
  text:"Skynet nu ne amenință. Iar Clippy, cu puțin noroc, s-a făcut mare.",
  fact:["De vineri","începe partea practică"]}
];
/* segmentele axei timpului (indici de scenă, inclusiv) */
var ERE = [["Start",0,0],["Bazele digitale",1,3],["Colaborare și conținut",4,6],["Siguranță și AI",7,8],["Final",9,9]];

/* ======================= PICTOGRAME (SVG original, fără fișiere externe) ======================= */
var S = 'fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"';
function svg(inner){ return '<svg viewBox="0 0 240 240" '+S+'><circle class="halo" cx="120" cy="120" r="112"/>'+inner+'</svg>'; }
var IC = {
 grila: svg([0,1,2,3,4,5,6,7].map(function(i){var x=52+(i%4)*36, y=88+Math.floor(i/4)*44; return '<rect '+(i===7?'class="a" ':'')+'x="'+x+'" y="'+y+'" width="26" height="32" rx="6"/>';}).join('')),
 nor: svg('<path d="M74 164a34 34 0 0 1 2-68 48 48 0 0 1 90 10 30 30 0 0 1 2 58z"/><path class="g" d="M120 150v-40m-16 14l16-16 16 16" stroke-width="6"/>'),
 lupa: svg('<circle cx="106" cy="106" r="48"/><line x1="142" y1="142" x2="192" y2="192" stroke-width="12"/>'+
   [90,106,122].map(function(y,i){return '<line class="g" x1="'+(84)+'" y1="'+y+'" x2="'+(128-i*8)+'" y2="'+y+'"/>';}).join('')),
 baloane: svg('<path d="M46 70h104a12 12 0 0 1 12 12v44a12 12 0 0 1-12 12H92l-24 22v-22H46a12 12 0 0 1-12-12V82a12 12 0 0 1 12-12z"/>'+
   '<path class="g" d="M108 156h88a12 12 0 0 1 12 12v22a12 12 0 0 1-12 12h-8v18l-22-18h-58a12 12 0 0 1-12-12v-22a12 12 0 0 1 12-12z"/>'+
   [70,98,126].map(function(x){return '<circle class="a" cx="'+x+'" cy="104" r="6"/>';}).join('')),
 fata: svg('<circle cx="120" cy="120" r="70"/><circle class="a" cx="96" cy="104" r="8"/><circle class="a" cx="144" cy="104" r="8"/><path d="M84 138a40 34 0 0 0 72 0"/>'),
 coedit: svg('<rect x="58" y="44" width="124" height="152" rx="10"/>'+
   [78,98,118,138].map(function(y){return '<line x1="76" y1="'+y+'" x2="'+(164-(y%3)*12)+'" y2="'+y+'" stroke-width="3"/>';}).join('')+
   '<path class="a" d="M150 150l34 12-14 6-6 14z"/><path class="f" d="M80 100l34 12-14 6-6 14z"/>'),
 lacat: svg('<rect x="66" y="108" width="108" height="86" rx="14"/><path d="M90 108V84a30 30 0 0 1 60 0v24"/><circle class="a" cx="120" cy="146" r="10"/><line x1="120" y1="152" x2="120" y2="172" stroke-width="7"/>'),
 carlig: svg('<rect x="44" y="118" width="120" height="82" rx="10"/><path d="M44 126l60 46 60-46"/><path class="g" d="M182 34v92a24 24 0 0 1-48 0v-6" stroke-width="5"/><path class="a" d="M134 128l-10-12 12-2z"/>'),
 agrafa: svg('<path d="M148 70v88a32 32 0 0 1-64 0V64a22 22 0 0 1 44 0v90a11 11 0 0 1-22 0V84" stroke-width="6"/>'+
   '<path class="g" d="M164 46h40a10 10 0 0 1 10 10v20a10 10 0 0 1-10 10h-22l-14 12V86h-4a10 10 0 0 1-10-10V56a10 10 0 0 1 10-10z" stroke-width="3"/>'+
   [174,188,202].map(function(x){return '<circle class="f" cx="'+x+'" cy="66" r="3.5"/>';}).join('')),
 harta: svg('<polyline class="g" points="50,160 86,100 128,146 170,84 200,120"/>'+
   [[50,160],[86,100],[128,146],[170,84]].map(function(p){return '<circle class="f" cx="'+p[0]+'" cy="'+p[1]+'" r="9"/>';}).join('')+
   '<circle class="a" cx="200" cy="120" r="13"/>')
};

/* ======================= STARE ======================= */
var params = new URLSearchParams(location.search);
var SCALA = Math.max(0.05, parseFloat(params.get('scala')) || 1);   /* ?scala=0.2 = repetiție rapidă; 1 = 180 s */
var TOTAL = 0, START = [];
SCENE.forEach(function(s){ s.dur = s.d*SCALA; START.push(TOTAL); TOTAL += s.dur; });
var idx = 0, pauza = false, elapsed = 0, ultimul = Date.now(), schimba = false, gata = false;

function el(id){ return document.getElementById(id); }
function z2(n){ return (n<10?'0':'')+n; }
function mmss(s){ s = Math.max(0, Math.round(s)); return Math.floor(s/60)+':'+z2(s%60); }

/* ---- axa timpului ---- */
function construiesteAxa(){
  var ere = el('ere'); ere.innerHTML='';
  ERE.forEach(function(e,i){
    var n = e[2]-e[1]+1, d = document.createElement('div'); d.className='era'; d.style.flex = n+' 1 0'; d.id='era'+i;
    d.innerHTML = '<div class="nm">'+e[0]+'</div><div class="ticks"></div>';
    var t = d.querySelector('.ticks');
    for (var k=e[1]; k<=e[2]; k++){ var b=document.createElement('button'); b.type='button'; b.className='tick'; b.id='tk'+k; b.title=SCENE[k].an+' — '+SCENE[k].titlu; b.setAttribute('aria-label',SCENE[k].an+' '+SCENE[k].titlu);
      b.innerHTML='<i></i>'; (function(kk){ b.onclick=function(){ mergiLa(kk); }; })(k); t.appendChild(b); }
    ere.appendChild(d);
  });
}
function coloreazaAxa(){
  SCENE.forEach(function(_,k){ var t=el('tk'+k); t.className='tick'+(k<idx?' done':(k===idx?' now':'')); t.firstChild.style.transform = k<idx ? 'scaleX(1)' : 'scaleX(0)'; });
  ERE.forEach(function(e,i){ el('era'+i).className='era'+(idx>=e[1]&&idx<=e[2]?' on':''); });
}

/* ---- afișarea unei scene (cu fade) ---- */
function fitAn(){
  var y = el('an'), box = el('scena'); y.style.fontSize = '';
  var sz = parseFloat(getComputedStyle(y).fontSize), g = 0;
  while (y.scrollWidth > box.clientWidth + 1 && sz > 34 && g++ < 40){ sz *= .94; y.style.fontSize = sz + 'px'; }
}
window.addEventListener('resize', fitAn);
function arata(i, imediat){
  var sc = SCENE[i], box = el('scena');
  function pune(){
    document.documentElement.style.setProperty('--warm', sc.cul);
    el('cand').textContent = sc.cand; el('an').textContent = sc.an;
    el('titlu').textContent = sc.titlu; el('text').textContent = sc.text;
    el('fact').innerHTML = '<b>'+sc.fact[0]+':</b><span></span>'; el('fact').lastChild.textContent = sc.fact[1];
    el('glyph').innerHTML = IC[sc.ic];
    box.classList.remove('out'); box.classList.add('in');
    coloreazaAxa(); fitAn();
  }
  if (imediat){ pune(); return; }
  box.classList.add('out'); box.classList.remove('in'); schimba = true;
  setTimeout(function(){ pune(); schimba = false; if (sonorOn) clopotel(); }, 600);
}
function mergiLa(i){ gata = false; el('bReia').hidden = true; idx = Math.max(0, Math.min(SCENE.length-1, i)); elapsed = 0; arata(idx); }

/* ---- ceasul: timp scurs din 3:00 ---- */
function tickCeas(){
  var t = START[idx] + Math.min(elapsed, SCENE[idx].dur);
  var tot = TOTAL/SCALA, cur = t/SCALA;
  el('ceas').innerHTML = mmss(cur) + '<span> / ' + mmss(tot) + '</span>';
  el('rest').textContent = gata ? 'Cursul e încheiat' : '';
}

/* ---- avansul automat ---- */
function tick(){
  var acum_ = Date.now(), dt = (acum_-ultimul)/1000; ultimul = acum_;
  if (!pauza && !schimba && !gata){
    elapsed += dt;
    var f = Math.min(1, elapsed/SCENE[idx].dur), t = el('tk'+idx); if (t) t.firstChild.style.transform = 'scaleX('+f+')';
    if (elapsed >= SCENE[idx].dur){
      if (idx < SCENE.length-1){ mergiLa(idx+1); }
      else { gata = true; el('bReia').hidden = false; }
    }
  }
  tickCeas();
}

/* ---- comenzi ---- */
el('bPrev').onclick = function(){ mergiLa(idx-1); };
el('bNext').onclick = function(){ mergiLa(idx+1); };
el('bReia').onclick = function(){ mergiLa(0); };
el('bPlay').onclick = function(){ pauza = !pauza; this.textContent = pauza ? 'Continuă' : 'Pauză'; this.setAttribute('aria-pressed', pauza); };
el('bFull').onclick = function(){ try{ if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); }catch(e){} };
document.addEventListener('keydown', function(e){
  if (e.target && e.target.tagName==='INPUT') return;
  if (e.key==='ArrowRight'||e.key==='PageDown') mergiLa(idx+1);
  else if (e.key==='ArrowLeft'||e.key==='PageUp') mergiLa(idx-1);
  else if (e.key===' '){ e.preventDefault(); el('bPlay').click(); }
  else if (e.key==='f'||e.key==='F') el('bFull').click();
  else if (e.key==='s'||e.key==='S') el('bSound').click();
  else if (e.key==='r'||e.key==='R') mergiLa(0);
});
/* cursorul și comenzile dispar după 3 secunde fără mișcare (ecran curat pe Zoom) */
var idleT; function nuIdle(){ document.body.classList.remove('idle'); clearTimeout(idleT); idleT=setTimeout(function(){document.body.classList.add('idle');},3000); }
['mousemove','keydown','touchstart'].forEach(function(ev){ document.addEventListener(ev, nuIdle, {passive:true}); }); nuIdle();

/* ======================= SUNET OPȚIONAL (generat în pagină, fără fișiere) =======================
   Ambient luminos: acorduri Do–Sol–La minor–Fa + note rare din pentatonica Do major, cu ecou.
   Implicit oprit. Pe Zoom: Share Screen + „Share sound”. */
var ac=null, master=null, sonorOn=false, plucks=null, chordT=null, chordI=0, pad=[], echoIn=null;
var ACORDURI = [[130.81,196.00,261.63,329.63],[98.00,146.83,196.00,246.94],[110.00,164.81,220.00,261.63],[87.31,130.81,174.61,220.00]];
var PENTA = [523.25,587.33,659.25,783.99,880.00,1046.50];
function graf(){
  ac = new (window.AudioContext||window.webkitAudioContext)();
  master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination);
  var lp = ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1100; lp.connect(master);
  echoIn = ac.createGain(); echoIn.gain.value = 1;
  var dl = ac.createDelay(2); dl.delayTime.value = .6; var fb = ac.createGain(); fb.gain.value = .4;
  var flt = ac.createBiquadFilter(); flt.type='lowpass'; flt.frequency.value=1800;
  echoIn.connect(dl); dl.connect(flt); flt.connect(fb); fb.connect(dl); flt.connect(master); echoIn.connect(master);
  for (var v=0; v<4; v++){
    var g = ac.createGain(); g.gain.value = .045; g.connect(lp);
    var o1 = ac.createOscillator(), o2 = ac.createOscillator(); o1.type='triangle'; o2.type='sine'; o2.detune.value = 7 + v*2;
    o1.frequency.value = o2.frequency.value = ACORDURI[0][v];
    o1.connect(g); o2.connect(g); o1.start(); o2.start(); pad.push([o1,o2]);
  }
}
function clopotel(){
  if (!ac) return; var f = PENTA[Math.floor(Math.random()*PENTA.length)], t = ac.currentTime;
  var o = ac.createOscillator(), g = ac.createGain(); o.type='sine'; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(.07,t+.03); g.gain.exponentialRampToValueAtTime(.0001,t+3);
  o.connect(g); g.connect(echoIn); o.start(t); o.stop(t+3.2);
}
function programeazaNote(){ if(!sonorOn) return; clopotel(); plucks = setTimeout(programeazaNote, 3000 + Math.random()*4000); }
function schimbaAcord(){
  if(!sonorOn) return; chordI = (chordI+1)%ACORDURI.length;
  pad.forEach(function(p,v){ p.forEach(function(o){ o.frequency.setTargetAtTime(ACORDURI[chordI][v], ac.currentTime, 2.2); }); });
  chordT = setTimeout(schimbaAcord, 12000);
}
function volum(){ return (parseInt(el('vol').value,10)/100)*0.9; }
el('bSound').onclick = function(){
  sonorOn = !sonorOn; this.setAttribute('aria-pressed', sonorOn); el('vol').hidden = !sonorOn;
  if (sonorOn){ if(!ac) graf(); ac.resume(); master.gain.cancelScheduledValues(ac.currentTime); master.gain.setTargetAtTime(volum(), ac.currentTime, 1.5);
    programeazaNote(); chordT = setTimeout(schimbaAcord, 12000); }
  else { clearTimeout(plucks); clearTimeout(chordT); master.gain.setTargetAtTime(0, ac.currentTime, .6); setTimeout(function(){ if(!sonorOn) ac.suspend(); }, 2500); }
};
el('vol').oninput = function(){ if (ac && sonorOn) master.gain.setTargetAtTime(volum(), ac.currentTime, .2); };
